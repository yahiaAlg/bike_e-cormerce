<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — ARKO</title>
  <meta name="description" content="The page you're looking for doesn't exist." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-active="">
  <div data-header></div>

  <section class="section">
    <div class="container-x">
      <div class="error-page">
        <div class="error-code">404</div>
        <h1>This Trail Has No End</h1>
        <p>The page you're looking for has gone off-road and we can't find it. Let's get you back on track.</p>
        <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:50px">
          <a href="/index.html" class="btn-volt btn-lg"><i class="bx bx-home"></i>Back to Home</a>
          <a href="/shop.html" class="btn-outline btn-lg"><i class="bx bx-store"></i>Browse Motorcycles</a>
          <a href="/support.html" class="btn-line"><i class="bx bx-support"></i>Contact Support</a>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:700px;margin:0 auto">
          <a href="/shop.html" style="background:var(--white);border:1px solid var(--line-light);padding:24px;text-align:center;transition:transform .3s ease" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform=''">
            <i class="bx bx-store" style="font-size:2rem;color:var(--volt-dim);margin-bottom:10px;display:block"></i>
            <h6 style="font-weight:700">Motorcycles</h6>
          </a>
          <a href="/accessories.html" style="background:var(--white);border:1px solid var(--line-light);padding:24px;text-align:center;transition:transform .3s ease" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform=''">
            <i class="bx bx-shopping-bag" style="font-size:2rem;color:var(--volt-dim);margin-bottom:10px;display:block"></i>
            <h6 style="font-weight:700">Accessories</h6>
          </a>
          <a href="/configurator.html" style="background:var(--white);border:1px solid var(--line-light);padding:24px;text-align:center;transition:transform .3s ease" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform=''">
            <i class="bx bx-plus-medical" style="font-size:2rem;color:var(--volt-dim);margin-bottom:10px;display:block"></i>
            <h6 style="font-weight:700">Configurator</h6>
          </a>
          <a href="/dealers.html" style="background:var(--white);border:1px solid var(--line-light);padding:24px;text-align:center;transition:transform .3s ease" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform=''">
            <i class="bx bx-map" style="font-size:2rem;color:var(--volt-dim);margin-bottom:10px;display:block"></i>
            <h6 style="font-weight:700">Find a Dealer</h6>
          </a>
        </div>
      </div>
    </div>
  </section>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script>
    if (typeof gsap !== 'undefined' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      gsap.from('.error-code', { scale: 0.5, opacity: 0, duration: 0.8, ease: 'back.out(1.7)' });
      gsap.from('.error-page h1', { y: 30, opacity: 0, duration: 0.6, delay: 0.3 });
      gsap.from('.error-page > p', { y: 20, opacity: 0, duration: 0.6, delay: 0.5 });
      gsap.from('.error-page > div > a', { y: 30, opacity: 0, duration: 0.5, stagger: 0.1, delay: 0.7 });
    }
  </script>
</body>
</html>
