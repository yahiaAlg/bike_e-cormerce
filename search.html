<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — ARKO</title>
  <meta name="description" content="Search ARKO motorcycles, accessories, and content." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-active="shop">
  <div data-header></div>

  <section class="page-header">
    <div class="container-x">
      <div class="eyebrow">Search</div>
      <h1 class="section-title">Find Your Ride</h1>
      <div class="breadcrumb">
        <a href="/index.html">Home</a><span class="sep">/</span>
        <span>Search</span>
      </div>
    </div>
  </section>

  <section class="section tight search-page">
    <div class="container-x">
      <div class="search-bar-large">
        <i class="bx bx-search"></i>
        <input type="text" id="globalSearch" placeholder="Search motorcycles, accessories, categories...">
        <button onclick="performSearch()">Search</button>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap">
        <button class="btn-dark btn-sm search-filter active" data-filter="all">All Results</button>
        <button class="btn-outline btn-sm search-filter" data-filter="motorcycles">Motorcycles</button>
        <button class="btn-outline btn-sm search-filter" data-filter="accessories">Accessories</button>
      </div>

      <div style="font-size:.88rem;color:#666;margin-bottom:20px"><strong id="searchCount">0</strong> results found</div>

      <div class="product-grid" id="searchResults"></div>

      <div class="empty-state" id="searchEmpty" style="display:none">
        <i class="bx bx-search-alt"></i>
        <h3>No results found</h3>
        <p>Try a different search term or browse our motorcycles and accessories.</p>
        <a href="/shop.html" class="btn-volt">Browse All Motorcycles</a>
      </div>

      <!-- Quick links when no search -->
      <div id="quickLinks" style="margin-top:40px">
        <h3 style="font-size:1.2rem;font-weight:800;margin-bottom:20px">Popular Searches</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn-outline btn-sm" onclick="quickSearch('enduro')">Enduro</button>
          <button class="btn-outline btn-sm" onclick="quickSearch('trail')">Trail</button>
          <button class="btn-outline btn-sm" onclick="quickSearch('adventure')">Adventure</button>
          <button class="btn-outline btn-sm" onclick="quickSearch('charger')">Chargers</button>
          <button class="btn-outline btn-sm" onclick="quickSearch('helmet')">Helmets</button>
          <button class="btn-outline btn-sm" onclick="quickSearch('battery')">Batteries</button>
          <button class="btn-outline btn-sm" onclick="quickSearch('protection')">Protection</button>
        </div>
      </div>
    </div>
  </section>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script>
    var searchFilter = 'all';
    var params = new URLSearchParams(location.search);
    var initialQuery = params.get('q') || '';

    document.querySelectorAll('.search-filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.search-filter').forEach(function (b) { b.classList.remove('active'); b.classList.remove('btn-dark'); b.classList.add('btn-outline'); });
        btn.classList.add('active'); btn.classList.add('btn-dark'); btn.classList.remove('btn-outline');
        searchFilter = btn.dataset.filter;
        performSearch();
      });
    });

    function performSearch() {
      var query = document.getElementById('globalSearch').value.toLowerCase().trim();
      var quickLinks = document.getElementById('quickLinks');

      if (!query) {
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('searchEmpty').style.display = 'none';
        document.getElementById('searchCount').textContent = '0';
        quickLinks.style.display = 'block';
        return;
      }

      quickLinks.style.display = 'none';

      var motorcycles = ARKO_DATA.motorcycles.filter(function (m) {
        return m.name.toLowerCase().indexOf(query) > -1 || m.category.toLowerCase().indexOf(query) > -1 || m.description.toLowerCase().indexOf(query) > -1;
      });
      var accessories = ARKO_DATA.accessories.filter(function (a) {
        return a.name.toLowerCase().indexOf(query) > -1 || a.category.toLowerCase().indexOf(query) > -1 || a.description.toLowerCase().indexOf(query) > -1;
      });

      var results = [];
      if (searchFilter === 'all' || searchFilter === 'motorcycles') results = results.concat(motorcycles);
      if (searchFilter === 'all' || searchFilter === 'accessories') results = results.concat(accessories);

      document.getElementById('searchCount').textContent = results.length;
      var grid = document.getElementById('searchResults');
      var empty = document.getElementById('searchEmpty');

      if (results.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        grid.innerHTML = results.map(productCardHTML).join('');
      }
    }

    function quickSearch(term) {
      document.getElementById('globalSearch').value = term;
      performSearch();
    }

    if (initialQuery) {
      document.getElementById('globalSearch').value = initialQuery;
      performSearch();
    }

    document.getElementById('globalSearch').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') performSearch();
    });
  </script>
</body>
</html>
