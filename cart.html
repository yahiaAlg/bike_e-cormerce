<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — ARKO</title>
  <meta name="description" content="Your ARKO shopping cart." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-active="shop">
  <div data-header></div>

  <section class="page-header">
    <div class="container-x">
      <div class="eyebrow">Shopping Cart</div>
      <h1 class="section-title">Your Cart</h1>
      <div class="breadcrumb">
        <a href="/index.html">Home</a><span class="sep">/</span>
        <span>Cart</span>
      </div>
    </div>
  </section>

  <section class="section tight">
    <div class="container-x">
      <div id="cartContent"></div>
    </div>
  </section>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script>
    function renderCart() {
      var cart = ARKO_STORE.getCart();
      var container = document.getElementById('cartContent');

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="bx bx-cart-alt"></i><h3>Your cart is empty</h3><p>You haven\'t added any motorcycles or accessories yet. Let\'s fix that.</p><a href="/shop.html" class="btn-volt"><i class="bx bx-store"></i>Browse Motorcycles</a></div>';
        return;
      }

      var itemsHTML = cart.map(function (item) {
        var p = getProductById(item.id);
        if (!p) return '';
        var optPrice = 0;
        var optHTML = '';
        if (item.options) {
          if (item.options.color) optHTML += '<div>Color: ' + item.options.color + '</div>';
          if (item.options.upgrades) {
            item.options.upgrades.forEach(function (u) {
              optPrice += (u.price || 0);
              optHTML += '<div>' + u.name + (u.price ? ' (+' + formatPrice(u.price) + ')' : '') + '</div>';
            });
          }
        }
        var unitPrice = p.price + optPrice;
        var lineTotal = unitPrice * item.qty;
        return '<div class="cart-item" data-key="' + item.key + '">' +
          '<img src="' + ARKO_IMG.search(p.image) + '" alt="' + p.name + '" />' +
          '<div class="cart-item-info">' +
            '<h4>' + p.name + '</h4>' +
            '<div class="item-meta">' + (p.category || '') + (optHTML ? ' • ' + optHTML : '') + '</div>' +
            '<div style="display:flex;gap:14px;margin-top:10px;align-items:center">' +
              '<div class="qty-selector"><button onclick="updateQty(\'' + item.key + '\',' + (item.qty - 1) + ')">-</button><input type="number" value="' + item.qty + '" readonly><button onclick="updateQty(\'' + item.key + '\',' + (item.qty + 1) + ')">+</button></div>' +
              '<button class="cart-item-remove" onclick="removeItem(\'' + item.key + '\')"><i class="bx bx-trash"></i></button>' +
            '</div>' +
          '</div>' +
          '<div class="cart-item-price">' + formatPrice(lineTotal) + '</div>' +
        '</div>';
      }).join('');

      var subtotal = ARKO_STORE.cartTotal();
      var shipping = subtotal > 1000 ? 0 : 49;
      var discount = 0;
      var total = subtotal + shipping - discount;

      container.innerHTML = '<div class="cart-layout">' +
        '<div style="background:var(--white);border:1px solid var(--line-light);padding:30px">' +
          '<h3 style="font-size:1.2rem;font-weight:800;margin-bottom:20px">Cart Items (' + cart.length + ')</h3>' +
          itemsHTML +
          '<div style="margin-top:20px;display:flex;justify-content:space-between">' +
            '<a href="/shop.html" class="btn-line"><i class="bx bx-left-arrow-alt"></i>Continue Shopping</a>' +
            '<button class="btn-outline btn-sm" onclick="clearCart()"><i class="bx bx-trash"></i>Clear Cart</button>' +
          '</div>' +
        '</div>' +
        '<div class="cart-summary">' +
          '<h3>Order Summary</h3>' +
          '<div class="cart-summary-line"><span>Subtotal</span><span>' + formatPrice(subtotal) + '</span></div>' +
          '<div class="cart-summary-line"><span>Shipping</span><span>' + (shipping === 0 ? 'Free' : formatPrice(shipping)) + '</span></div>' +
          '<div class="promo-input"><input type="text" placeholder="Promo code" id="promoCode"><button onclick="applyPromo()">Apply</button></div>' +
          '<div class="cart-summary-line" id="discountLine" style="display:none"><span>Discount</span><span id="discountAmount">-€0</span></div>' +
          '<div class="cart-summary-total"><span>Total</span><span id="cartTotal">' + formatPrice(total) + '</span></div>' +
          '<div style="margin-top:20px">' +
            '<a href="/checkout.html" class="btn-volt btn-block btn-lg"><i class="bx bx-rocket"></i>Proceed to Checkout</a>' +
          '</div>' +
          '<div style="margin-top:16px;display:flex;justify-content:center;gap:16px;font-size:1.5rem;color:#999">' +
            '<i class="bx bxl-visa"></i><i class="bx bxl-mastercard"></i><i class="bx bxl-paypal"></i><i class="bx bx-credit-card"></i>' +
          '</div>' +
          '<div style="margin-top:14px;display:flex;align-items:center;gap:8px;font-size:.82rem;color:#666;justify-content:center">' +
            '<i class="bx bx-lock-alt" style="color:var(--success)"></i>Secure checkout' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function updateQty(key, qty) {
      ARKO_STORE.updateCartQty(key, qty);
      renderCart();
    }

    function removeItem(key) {
      ARKO_STORE.removeFromCart(key);
      arkoToast('Item removed');
      renderCart();
    }

    function clearCart() {
      ARKO_STORE.clearCart();
      renderCart();
    }

    function applyPromo() {
      var code = document.getElementById('promoCode').value.toUpperCase().trim();
      if (code === 'ARKO10') {
        var subtotal = ARKO_STORE.cartTotal();
        var discount = Math.round(subtotal * 0.1);
        var shipping = subtotal > 1000 ? 0 : 49;
        var total = subtotal + shipping - discount;
        document.getElementById('discountLine').style.display = 'flex';
        document.getElementById('discountAmount').textContent = '-' + formatPrice(discount);
        document.getElementById('cartTotal').textContent = formatPrice(total);
        arkoToast('Promo applied: 10% off', 'success');
      } else if (code) {
        arkoToast('Invalid promo code', 'error');
      }
    }

    renderCart();
  </script>
</body>
</html>
