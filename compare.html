<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare Models — ARKO</title>
  <meta name="description" content="Compare ARKO electric motorcycles side by side. Range, power, weight, price, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-active="shop">
  <div data-header></div>

  <section class="page-header">
    <div class="container-x">
      <div class="eyebrow">Side by Side</div>
      <h1 class="section-title">Compare Models</h1>
      <div class="breadcrumb">
        <a href="/index.html">Home</a><span class="sep">/</span>
        <span>Compare</span>
      </div>
    </div>
  </section>

  <section class="section tight">
    <div class="container-x">
      <!-- Compare slots -->
      <div class="compare-slots" id="compareSlots"></div>

      <!-- Add model dropdown -->
      <div style="margin-bottom:30px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div style="position:relative">
          <button class="btn-dark btn-sm" id="addModelBtn"><i class='bx bx-plus'></i>Add Model to Compare</button>
          <div id="addModelDropdown" style="display:none;position:absolute;top:100%;left:0;margin-top:8px;background:var(--white);border:1px solid var(--line-light);min-width:260px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.15)">
            <div id="addModelList"></div>
          </div>
        </div>
        <button class="btn-outline btn-sm" onclick="clearCompare()"><i class='bx bx-trash'></i>Clear All</button>
      </div>

      <!-- Comparison table -->
      <div class="compare-table-wrap" id="compareTableWrap" style="display:none">
        <table class="compare-table" id="compareTable"></table>
      </div>

      <div class="empty-state" id="compareEmpty">
        <i class='bx bx-git-compare'></i>
        <h3>No models selected</h3>
        <p>Add 2–4 motorcycles to compare specifications side by side. Use the "Add Model" button above to get started.</p>
      </div>
    </div>
  </section>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script>
    function renderCompare() {
      var compareIds = ARKO_STORE.getCompare();
      var slots = document.getElementById('compareSlots');
      var tableWrap = document.getElementById('compareTableWrap');
      var empty = document.getElementById('compareEmpty');

      // Render slots
      var slotsHTML = '';
      for (var i = 0; i < 4; i++) {
        var id = compareIds[i];
        if (id) {
          var m = getMotorcycleById(id);
          if (m) {
            slotsHTML += '<div class="compare-slot filled"><div class="slot-product">' +
              '<img src="' + ARKO_IMG.search(m.image) + '" alt="' + m.name + '" />' +
              '<div class="name">' + m.name + '</div>' +
              '<div class="price">' + formatPrice(m.price) + '</div>' +
              '</div><div class="remove-btn" onclick="removeFromCompareSlot(\'' + id + '\')"><i class="bx bx-x"></i> Remove</div></div>';
          }
        } else {
          slotsHTML += '<div class="compare-slot"><i class="bx bx-plus-circle"></i><p>Add a model</p></div>';
        }
      }
      slots.innerHTML = slotsHTML;

      if (compareIds.length < 1) {
        tableWrap.style.display = 'none';
        empty.style.display = 'block';
      } else {
        tableWrap.style.display = 'block';
        empty.style.display = 'none';
        renderTable(compareIds);
      }

      // Update add model dropdown
      updateAddModelList();
    }

    function renderTable(ids) {
      var products = ids.map(function (id) { return getMotorcycleById(id); }).filter(Boolean);
      var rows = [
        { label: 'Category', key: 'category' },
        { label: 'Price', key: 'price', format: 'price' },
        { label: 'Range', key: 'specs.range' },
        { label: 'Power', key: 'specs.power' },
        { label: 'Weight', key: 'specs.weight' },
        { label: 'Top Speed', key: 'specs.topSpeed' },
        { label: 'Battery', key: 'specs.battery' },
        { label: 'Charge Time', key: 'specs.chargeTime' },
        { label: 'Rating', key: 'rating', format: 'rating' },
        { label: 'Reviews', key: 'reviewCount' },
        { label: 'Availability', key: 'availability', format: 'availability' },
        { label: 'Colors', key: 'colors', format: 'colors' }
      ];

      function getValue(obj, path) {
        var parts = path.split('.');
        var val = obj;
        parts.forEach(function (p) { val = val ? val[p] : undefined; });
        return val;
      }

      var html = '<thead><tr><th></th>';
      products.forEach(function (p) {
        html += '<th><img src="' + ARKO_IMG.search(p.image) + '" class="compare-product-img" alt="' + p.name + '" />' +
          '<div class="compare-product-name">' + p.name + '</div>' +
          '<div class="compare-product-price">' + formatPrice(p.price) + '</div>' +
          '<a href="/product.html?id=' + p.id + '" class="btn-volt btn-sm" style="margin-top:10px">View</a></th>';
      });
      html += '</tr></thead><tbody>';

      rows.forEach(function (row) {
        var values = products.map(function (p) { return getValue(p, row.key); });
        var allSame = values.every(function (v) { return v === values[0]; });

        html += '<tr><td>' + row.label + '</td>';
        values.forEach(function (val, i) {
          var cellClass = !allSame ? 'diff-highlight' : '';
          var display = val;
          if (row.format === 'price') display = formatPrice(val);
          if (row.format === 'rating') display = starRating(val, '.9rem') + ' ' + val;
          if (row.format === 'availability') display = val === 'in-stock' ? 'In Stock' : val === 'pre-order' ? 'Pre-Order' : 'Out of Stock';
          if (row.format === 'colors') {
            display = (val || []).map(function (c) { return '<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:' + c.hex + ';margin:0 2px;border:1px solid #fff;box-shadow:0 0 0 1px var(--line-light)"></span>'; }).join('');
          }
          html += '<td class="' + cellClass + '">' + (display || '—') + '</td>';
        });
        html += '</tr>';
      });

      html += '<tr><td></td>';
      products.forEach(function (p) {
        html += '<td><button class="btn-outline btn-sm" onclick="arkoAddToCart(\'' + p.id + '\')"><i class="bx bx-cart"></i>Add to Cart</button></td>';
      });
      html += '</tr></tbody>';

      document.getElementById('compareTable').innerHTML = html;
    }

    function updateAddModelList() {
      var compareIds = ARKO_STORE.getCompare();
      var available = ARKO_DATA.motorcycles.filter(function (m) { return compareIds.indexOf(m.id) === -1; });
      document.getElementById('addModelList').innerHTML = available.length ? available.map(function (m) {
        return '<div style="padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line-light);font-size:.9rem" onmouseover="this.style.background=\'var(--bone-2)\'" onmouseout="this.style.background=\'\'" onclick="addModelToCompare(\'' + m.id + '\')">' + m.name + ' — ' + formatPrice(m.price) + '</div>';
      }).join('') : '<div style="padding:14px;color:#999;font-size:.85rem">All models added</div>';
    }

    document.getElementById('addModelBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var dd = document.getElementById('addModelDropdown');
      dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', function () {
      document.getElementById('addModelDropdown').style.display = 'none';
    });

    function addModelToCompare(id) {
      var result = ARKO_STORE.toggleCompare(id);
      if (result === false) {
        arkoToast('Compare list is full (max 4)', 'error');
      } else {
        arkoToast('Added to compare', 'success');
      }
      document.getElementById('addModelDropdown').style.display = 'none';
      renderCompare();
    }

    function removeFromCompareSlot(id) {
      ARKO_STORE.removeFromCompare(id);
      arkoToast('Removed from compare');
      renderCompare();
    }

    function clearCompare() {
      ARKO_STORE.getCompare().forEach(function (id) { ARKO_STORE.removeFromCompare(id); });
      renderCompare();
    }

    renderCompare();
  </script>
</body>
</html>
