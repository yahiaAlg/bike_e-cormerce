<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessories — ARKO</title>
  <meta name="description" content="Browse ARKO accessories, parts, riding gear, and chargers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-active="accessories">
  <div data-header></div>

  <section class="page-header">
    <div class="container-x">
      <div class="eyebrow">Gear & Parts</div>
      <h1 class="section-title">Accessories</h1>
      <div class="breadcrumb">
        <a href="/index.html">Home</a><span class="sep">/</span>
        <span>Accessories</span>
      </div>
    </div>
  </section>

  <section class="section tight">
    <div class="container-x">
      <div class="shop-layout">
        <aside class="filter-sidebar" id="accFilterSidebar">
          <div class="filter-group">
            <h5>Category</h5>
            <div id="accFilterCats"></div>
          </div>
          <div class="filter-group">
            <h5>Price Range</h5>
            <input type="range" id="accPriceRange" min="50" max="2000" step="50" value="2000" style="width:100%;accent-color:var(--ink)" />
            <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:.82rem;color:#666">
              <span>€50</span><span id="accPriceMaxLabel">€2,000</span>
            </div>
          </div>
          <div class="filter-group">
            <h5>Availability</h5>
            <label class="filter-option"><input type="checkbox" id="accInStock" checked> <label>In Stock</label></label>
          </div>
          <button class="btn-outline btn-sm btn-block" onclick="clearAccFilters()">Clear All Filters</button>
        </aside>

        <div>
          <div class="shop-toolbar">
            <div class="result-count"><strong id="accResultCount">0</strong> accessories found</div>
            <div class="shop-toolbar-right">
              <select id="accSortBy">
                <option value="featured">Sort: Featured</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
              </select>
              <button class="btn-outline btn-sm filter-toggle-mobile" onclick="document.getElementById('accFilterSidebar').classList.toggle('is-open')"><i class='bx bx-filter'></i> Filters</button>
            </div>
          </div>
          <div class="accessory-grid" id="accGrid"></div>
          <div class="empty-state" id="accEmpty" style="display:none">
            <i class='bx bx-search-alt'></i>
            <h3>No accessories match your filters</h3>
            <button class="btn-dark" onclick="clearAccFilters()">Clear Filters</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script>
    var accState = { category: [], priceMax: 2000, sort: 'featured' };
    var params = new URLSearchParams(location.search);
    if (params.get('category')) accState.category = [params.get('category')];

    var accCats = ['Riding Gear', 'Chargers', 'Batteries', 'Protection', 'Parts'];
    document.getElementById('accFilterCats').innerHTML = accCats.map(function (c) {
      var count = ARKO_DATA.accessories.filter(function (a) { return a.category === c; }).length;
      var checked = accState.category.indexOf(c) > -1 ? 'checked' : '';
      return '<label class="filter-option"><input type="checkbox" class="acc-cat-filter" value="' + c + '" ' + checked + '> <label>' + c + '</label> <span class="count">(' + count + ')</span></label>';
    }).join('');

    document.querySelectorAll('.acc-cat-filter').forEach(function (el) {
      el.addEventListener('change', function () {
        accState.category = Array.from(document.querySelectorAll('.acc-cat-filter:checked')).map(function (c) { return c.value; });
        renderAcc();
      });
    });
    document.getElementById('accPriceRange').addEventListener('input', function (e) {
      accState.priceMax = parseInt(e.target.value);
      document.getElementById('accPriceMaxLabel').textContent = '\u20ac' + accState.priceMax.toLocaleString('en-US');
      renderAcc();
    });
    document.getElementById('accSortBy').addEventListener('change', function (e) { accState.sort = e.target.value; renderAcc(); });

    function clearAccFilters() {
      accState = { category: [], priceMax: 2000, sort: 'featured' };
      document.querySelectorAll('.acc-cat-filter').forEach(function (c) { c.checked = false; });
      document.getElementById('accPriceRange').value = 2000;
      document.getElementById('accPriceMaxLabel').textContent = '\u20ac2,000';
      document.getElementById('accSortBy').value = 'featured';
      renderAcc();
    }

    function renderAcc() {
      var products = ARKO_DATA.accessories.slice();
      if (accState.category.length) products = products.filter(function (p) { return accState.category.indexOf(p.category) > -1; });
      products = products.filter(function (p) { return p.price <= accState.priceMax; });
      switch (accState.sort) {
        case 'price-low': products.sort(function (a, b) { return a.price - b.price; }); break;
        case 'price-high': products.sort(function (a, b) { return b.price - a.price; }); break;
        case 'rating': products.sort(function (a, b) { return b.rating - a.rating; }); break;
      }
      document.getElementById('accResultCount').textContent = products.length;
      var grid = document.getElementById('accGrid');
      var empty = document.getElementById('accEmpty');
      if (products.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; }
      else { empty.style.display = 'none'; grid.innerHTML = products.map(productCardHTML).join(''); }
    }

    renderAcc();
  </script>
</body>
</html>
