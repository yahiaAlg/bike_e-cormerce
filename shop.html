<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Motorcycles — ARKO</title>
  <meta name="description" content="Browse the full range of ARKO electric motorcycles. Filter by category, price, range, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-active="shop">
  <div data-header></div>

  <section class="page-header">
    <div class="container-x">
      <div class="eyebrow">The Fleet</div>
      <h1 class="section-title">Shop Motorcycles</h1>
      <div class="breadcrumb">
        <a href="/index.html">Home</a><span class="sep">/</span>
        <span>Motorcycles</span>
      </div>
    </div>
  </section>

  <section class="section tight">
    <div class="container-x">
      <div class="shop-layout">
        <aside class="filter-sidebar" id="filterSidebar">
          <div class="filter-group">
            <h5>Category</h5>
            <div id="filterCategories"></div>
          </div>
          <div class="filter-group">
            <h5>Price Range</h5>
            <div class="filter-price-range">
              <input type="range" id="priceRange" min="9000" max="22000" step="500" value="22000" style="width:100%;accent-color:var(--ink)" />
              <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:.82rem;color:#666">
                <span>€9,000</span>
                <span id="priceMaxLabel">€22,000</span>
              </div>
            </div>
          </div>
          <div class="filter-group">
            <h5>Minimum Range</h5>
            <div id="filterRange"></div>
          </div>
          <div class="filter-group">
            <h5>Availability</h5>
            <label class="filter-option"><input type="checkbox" id="filterInStock" checked> <label for="filterInStock">In Stock</label></label>
            <label class="filter-option"><input type="checkbox" id="filterPreOrder" checked> <label for="filterPreOrder">Pre-Order</label></label>
          </div>
          <div class="filter-group">
            <h5>Color</h5>
            <div class="filter-colors" id="filterColors"></div>
          </div>
          <button class="btn-outline btn-sm btn-block" onclick="clearFilters()">Clear All Filters</button>
        </aside>

        <div class="shop-results">
          <div class="shop-toolbar">
            <div class="result-count"><strong id="resultCount">0</strong> motorcycles found</div>
            <div class="shop-toolbar-right">
              <select id="sortBy">
                <option value="featured">Sort: Featured</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
                <option value="range">Longest Range</option>
              </select>
              <div class="view-toggle">
                <button class="active" data-view="grid"><i class='bx bx-grid-alt'></i></button>
                <button data-view="list"><i class='bx bx-list-ul'></i></button>
              </div>
              <button class="btn-outline btn-sm filter-toggle-mobile" onclick="document.getElementById('filterSidebar').classList.toggle('is-open')"><i class='bx bx-filter'></i> Filters</button>
            </div>
          </div>
          <div class="product-grid" id="shopGrid"></div>
          <div class="empty-state" id="shopEmpty" style="display:none">
            <i class='bx bx-search-alt'></i>
            <h3>No motorcycles match your filters</h3>
            <p>Try adjusting your filters or clearing them to see the full range.</p>
            <button class="btn-dark" onclick="clearFilters()">Clear Filters</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script>
    var state = { category: [], priceMax: 22000, minRange: 0, inStock: true, preOrder: true, colors: [], sort: 'featured' };

    // Parse URL params
    var params = new URLSearchParams(location.search);
    if (params.get('category')) state.category = [params.get('category')];

    // Build category filters
    var cats = ['Enduro', 'Trail', 'Adventure', 'Performance'];
    document.getElementById('filterCategories').innerHTML = cats.map(function (c) {
      var count = ARKO_DATA.motorcycles.filter(function (m) { return m.category === c; }).length;
      var checked = state.category.indexOf(c) > -1 ? 'checked' : '';
      return '<label class="filter-option"><input type="checkbox" class="cat-filter" value="' + c + '" ' + checked + '> <label>' + c + '</label> <span class="count">(' + count + ')</span></label>';
    }).join('');

    // Build range filters
    var ranges = [{ label: '50+ km', val: 50 }, { label: '100+ km', val: 100 }, { label: '150+ km', val: 150 }];
    document.getElementById('filterRange').innerHTML = ranges.map(function (r) {
      return '<label class="filter-option"><input type="radio" name="minRange" value="' + r.val + '" ' + (state.minRange == r.val ? 'checked' : '') + '> <label>' + r.label + '</label></label>';
    }).join('');

    // Build color filters
    var allColors = {};
    ARKO_DATA.motorcycles.forEach(function (m) {
      (m.colors || []).forEach(function (c) {
        if (!allColors[c.name]) allColors[c.name] = c.hex;
      });
    });
    document.getElementById('filterColors').innerHTML = Object.keys(allColors).map(function (name) {
      return '<span class="swatch" style="background:' + allColors[name] + '" data-color="' + name + '" title="' + name + '"></span>';
    }).join('');

    // Event listeners
    document.querySelectorAll('.cat-filter').forEach(function (el) {
      el.addEventListener('change', function () {
        state.category = Array.from(document.querySelectorAll('.cat-filter:checked')).map(function (c) { return c.value; });
        render();
      });
    });
    document.getElementById('priceRange').addEventListener('input', function (e) {
      state.priceMax = parseInt(e.target.value);
      document.getElementById('priceMaxLabel').textContent = '\u20ac' + state.priceMax.toLocaleString('en-US');
      render();
    });
    document.querySelectorAll('input[name="minRange"]').forEach(function (el) {
      el.addEventListener('change', function (e) {
        state.minRange = parseInt(e.target.value);
        render();
      });
    });
    document.getElementById('filterInStock').addEventListener('change', function (e) { state.inStock = e.target.checked; render(); });
    document.getElementById('filterPreOrder').addEventListener('change', function (e) { state.preOrder = e.target.checked; render(); });
    document.querySelectorAll('.filter-colors .swatch').forEach(function (el) {
      el.addEventListener('click', function () {
        el.classList.toggle('active');
        state.colors = Array.from(document.querySelectorAll('.filter-colors .swatch.active')).map(function (s) { return s.dataset.color; });
        render();
      });
    });
    document.getElementById('sortBy').addEventListener('change', function (e) { state.sort = e.target.value; render(); });

    function clearFilters() {
      state = { category: [], priceMax: 22000, minRange: 0, inStock: true, preOrder: true, colors: [], sort: 'featured' };
      document.querySelectorAll('.cat-filter').forEach(function (c) { c.checked = false; });
      document.getElementById('priceRange').value = 22000;
      document.getElementById('priceMaxLabel').textContent = '\u20ac22,000';
      document.querySelectorAll('input[name="minRange"]').forEach(function (r) { r.checked = false; });
      document.getElementById('filterInStock').checked = true;
      document.getElementById('filterPreOrder').checked = true;
      document.querySelectorAll('.filter-colors .swatch').forEach(function (s) { s.classList.remove('active'); });
      document.getElementById('sortBy').value = 'featured';
      render();
    }

    function getFiltered() {
      var products = ARKO_DATA.motorcycles.slice();
      if (state.category.length) products = products.filter(function (p) { return state.category.indexOf(p.category) > -1; });
      products = products.filter(function (p) { return p.price <= state.priceMax; });
      if (state.minRange > 0) products = products.filter(function (p) { return parseInt(p.specs.range) >= state.minRange; });
      if (!state.inStock) products = products.filter(function (p) { return p.availability !== 'in-stock'; });
      if (!state.preOrder) products = products.filter(function (p) { return p.availability !== 'pre-order'; });
      if (state.colors.length) products = products.filter(function (p) {
        return (p.colors || []).some(function (c) { return state.colors.indexOf(c.name) > -1; });
      });
      switch (state.sort) {
        case 'price-low': products.sort(function (a, b) { return a.price - b.price; }); break;
        case 'price-high': products.sort(function (a, b) { return b.price - a.price; }); break;
        case 'rating': products.sort(function (a, b) { return b.rating - a.rating; }); break;
        case 'range': products.sort(function (a, b) { return parseInt(b.specs.range) - parseInt(a.specs.range); }); break;
      }
      return products;
    }

    function render() {
      var filtered = getFiltered();
      document.getElementById('resultCount').textContent = filtered.length;
      var grid = document.getElementById('shopGrid');
      var empty = document.getElementById('shopEmpty');
      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        grid.innerHTML = filtered.map(productCardHTML).join('');
      }
    }

    render();
  </script>
</body>
</html>
