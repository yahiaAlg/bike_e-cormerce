<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist — ARKO</title>
  <meta name="description" content="Your saved ARKO products." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-active="shop">
  <div data-header></div>

  <section class="page-header">
    <div class="container-x">
      <div class="eyebrow">Saved Items</div>
      <h1 class="section-title">Wishlist</h1>
      <div class="breadcrumb">
        <a href="/index.html">Home</a><span class="sep">/</span>
        <span>Wishlist</span>
      </div>
    </div>
  </section>

  <section class="section tight">
    <div class="container-x">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:14px">
        <div style="font-size:.88rem;color:#666"><strong id="wishCount">0</strong> items in your wishlist</div>
        <div style="display:flex;gap:10px">
          <button class="btn-outline btn-sm" onclick="moveAllToCart()"><i class="bx bx-cart"></i>Move All to Cart</button>
          <a href="/shop.html" class="btn-line"><i class="bx bx-store"></i>Continue Shopping</a>
        </div>
      </div>
      <div class="wishlist-grid" id="wishlistGrid"></div>
    </div>
  </section>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script>
    function renderWishlist() {
      var wish = ARKO_STORE.getWishlist();
      document.getElementById('wishCount').textContent = wish.length;
      var grid = document.getElementById('wishlistGrid');

      if (wish.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="bx bx-heart"></i><h3>Your wishlist is empty</h3><p>Save motorcycles and accessories you love to find them here later.</p><a href="/shop.html" class="btn-volt"><i class="bx bx-store"></i>Browse Motorcycles</a></div>';
        return;
      }

      grid.innerHTML = wish.map(function (id) {
        var p = getProductById(id);
        if (!p) return '';
        var img = ARKO_IMG.search(p.image);
        return '<div class="product-card" data-product-id="' + p.id + '">' +
          '<div class="product-card-media" onclick="window.location.href=\'/product.html?id=' + p.id + '\'">' +
            '<img src="' + img + '" alt="' + p.name + '" loading="lazy" />' +
          '</div>' +
          '<div class="product-card-body">' +
            '<div class="product-card-cat">' + p.category + '</div>' +
            '<div class="product-card-name">' + p.name + '</div>' +
            '<div class="product-card-rating">' + starRating(p.rating) + '<span class="count">(' + p.reviewCount + ')</span></div>' +
            '<div class="product-card-price">' + formatPrice(p.price) + '</div>' +
            '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
              '<button class="btn-volt btn-sm" onclick="moveToCart(\'' + p.id + '\')"><i class="bx bx-cart"></i>Move to Cart</button>' +
              '<button class="btn-outline btn-sm" onclick="compareFromWish(\'' + p.id + '\')"><i class="bx bx-git-compare"></i>Compare</button>' +
              '<button class="btn-outline btn-sm" onclick="removeFromWishList(\'' + p.id + '\')"><i class="bx bx-trash"></i>Remove</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function moveToCart(id) {
      ARKO_STORE.addToCart(id, 1, {});
      ARKO_STORE.removeFromWishlist(id);
      arkoToast('Moved to cart', 'success');
      renderWishlist();
    }

    function compareFromWish(id) {
      var result = ARKO_STORE.toggleCompare(id);
      if (result === false) arkoToast('Compare list is full (max 4)', 'error');
      else arkoToast('Added to compare', 'success');
    }

    function removeFromWishList(id) {
      ARKO_STORE.removeFromWishlist(id);
      arkoToast('Removed from wishlist');
      renderWishlist();
    }

    function moveAllToCart() {
      var wish = ARKO_STORE.getWishlist();
      wish.forEach(function (id) { ARKO_STORE.addToCart(id, 1, {}); });
      wish.forEach(function (id) { ARKO_STORE.removeFromWishlist(id); });
      arkoToast('All items moved to cart', 'success');
      renderWishlist();
    }

    renderWishlist();
  </script>
</body>
</html>
